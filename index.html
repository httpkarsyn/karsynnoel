    <div class="detail-text">
      <p>Karsyn is a designer based in Brooklyn, New York, with a background in Communication Design from Parsons. She works across branding, editorial, and digital design, focusing on the small details that shape how something feels.</p><br>
      
      <p>Before design, she worked as a hairdresser and later moved into photography and marketing. Those experiences taught her how to notice things, listen, and understand how visuals and language can come together to tell a story.</p><br>
      
      <p>Her work is rooted in systems thinking, emotion, and rhythm. Whether she’s designing a publication, a user flow, or something tactile, she’s always thinking about how people move through it. She aims to make work that feels intentional, personal, and a little unexpected.</p>
    </div>

  <template id="day-right">
    <div class="detail-credit">
      A Day in December<br><em>Bible Redesign</em>
    </div>
  
    <div class="detail-text">
      A Day in December explores how design can reshape a first interaction with the Bible. For much of my life, Christianity felt unfamiliar and distant, but returning to my faith made me aware of how visual language shapes accessibility, perception, and emotional connection.<br><br>

This project creates a more immediate, personal encounter with scripture by combining modern typography with historically grounded visuals. The 1,500-page volume features gilded edges, gold-laminated details, and a black leather cover, encouraging a slower, more intentional reading experience.<br><br>

Handwritten annotations introduce an archival layer, reframing the Bible as both a sacred object and a living document that reflects a personal relationship with God.<br><br>

Through materiality, typography, and contrast, the project reconsiders how the Bible is experienced, aiming to make it feel more approachable and immersive.<br><br>

The title references both the birth of Jesus and a personal artifact: a Bible gifted with the inscription “A Day in September,” marking a moment of return and renewal.
    </div>

    <div class="detail-credit">
      The Intensity of Being<br><em>Female Curation, Traces of Her, Rotten Desire</em>
    </div>
    <div class="detail-text">
      <p>A three-part series exploring the intensity of being a woman. The jumper-ring binding and photo treatment create a subtle discomfort to draw viewers into the narrative. Each section includes a written piece by women reflecting their relationship to the topic.<br><br>Feminine Curation examines beauty standards, comparing the feminine form to flowers. Traces of Her captures the lingering presence of feminine energy through objects, marks, or a lit space. Rotten Desire explores trauma, the dangers women face, and daily struggles, comparing the female form to decaying fruit to highlight the tension between beauty, vulnerability, and harsh realities.</p>
    </div>

    <div class="detail-credit">
      Chain Reaction<br><em>User Experience | MoMA</em>
    </div>
    <div class="detail-text">
      <p>Chain Reaction is an exhibition concept for MoMA that explores how one artwork sparks another. Visually making connection to a Newton’s Cradle and used it as a direct design reference. The design uses two typefaces built from perfect circles to reflect that sense of connection and movement. A single black dot became the main visual element and even replaced traditional punctuation, symbolizing the moment where ideas meet and energy transfers. The result is a clean, rhythmic identity that captures how art continuously inspires what comes next.</p>
    </div>
